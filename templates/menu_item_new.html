{% extends "base.html" %}

{% block title %}Add Menu Item | Cafe Calle Ocho{% endblock %}

{% block content %}

<h1>Add Menu Item</h1>

{% if error %}
<p role="alert">{{ error }}</p>
{% endif %}

<form method="post" action="{{ url_for('new_menu_item') }}">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" value="{{ name }}" required>

    <label for="category">Category</label>
    <input id="category" name="category" type="text" value="{{ category }}" required>

    <label for="price">Price ($)</label>
    <input id="price" name="price" type="number" min="0" step="0.01"
           value="{{ price }}" required>

    <label for="available">
        <input id="available" name="available" type="checkbox"
               {% if available %}checked{% endif %}>
        Available
    </label>

    <button type="submit">Save Menu Item</button>
</form>

{% endblock %}
